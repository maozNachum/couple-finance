project_id = "couple-finance"
[api]
enabled = true
port = 15421
schemas = ["api"]
extra_search_path = ["extensions"]
max_rows = 1000
auto_expose_new_tables = false
[db]
port = 15432
shadow_port = 15430
major_version = 17
[db.seed]
enabled = false
[studio]
enabled = false
[realtime]
enabled = false
[storage]
enabled = true
[analytics]
enabled = false
[edge_runtime]
enabled = true
[local_smtp]
enabled = true
port = 15424
[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/auth/confirm", "http://127.0.0.1:4173/auth/confirm"]
jwt_expiry = 600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 12
[auth.rate_limit]
# Local captured-email testing only; no external SMTP is configured.
email_sent = 100
[auth.email]
# Enables the email provider in the local CLI; global auth.enable_signup=false
# still rejects enrollment (verified through actual /signup and /otp requests).
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "1s"
otp_expiry = 600
[auth.email.template.invite]
subject = "Your Couple Finance invitation"
content_path = "./supabase/templates/invite.html"
[auth.email.template.magic_link]
subject = "Sign in to Couple Finance"
content_path = "./supabase/templates/magic-link.html"

[functions.import-preview]
verify_jwt = true
